<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客情報入力</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #243247;
      background: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 24px; }
    main { max-width: 1120px; margin: 0 auto; }
    h1 { margin: 0 0 24px; font-size: clamp(1.7rem, 3vw, 2.1rem); color: #172b4d; }
    h2 { margin: 0 0 18px; font-size: 1.2rem; color: #172b4d; }
    .panel {
      background: #fff;
      border: 1px solid #dce4ef;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgb(25 45 75 / 5%);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: .9rem; font-weight: 650; color: #34445c; }
    input {
      width: 100%; min-height: 42px; padding: 9px 11px;
      border: 1px solid #c8d2e0; border-radius: 7px;
      background: #fff; color: #243247; font: inherit;
    }
    input:focus { outline: 3px solid rgb(0 123 255 / 17%); border-color: #1677e8; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button {
      min-height: 42px; padding: 9px 20px; border: 0; border-radius: 7px;
      color: #fff; font: inherit; font-weight: 700; cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    button:hover { filter: brightness(.93); }
    button:active { transform: translateY(1px); }
    .register-button { background: #0878e8; }
    .delete-button { background: #dc3545; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #e5eaf1; text-align: left; white-space: nowrap; }
    th { background: #f3f6fa; color: #42536b; font-size: .88rem; font-weight: 700; }
    tbody tr:hover { background: #f8fbff; }
    td.checkbox-cell, th.checkbox-cell { width: 48px; text-align: center; }
    td.checkbox-cell input { width: 18px; min-height: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: #0878e8; }
    .empty-message { padding: 24px; color: #748197; text-align: center; }
    .count { margin: 0 0 12px; color: #63728a; font-size: .9rem; }
    @media (max-width: 760px) {
      body { padding: 24px 14px; }
      .panel { padding: 18px; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    }
    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .actions { flex-wrap: wrap; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>顧客情報入力</h1>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">顧客情報</h2>
      <form id="customer-form">
        <div class="form-grid">
          <div class="field"><label for="customer-no">No</label><input id="customer-no" name="no" type="text" inputmode="numeric" pattern="[0-9]+" title="数字を入力してください" autocomplete="off" required></div>
          <div class="field"><label for="last-name">姓</label><input id="last-name" name="lastName" type="text"></div>
          <div class="field"><label for="first-name">名</label><input id="first-name" name="firstName" type="text"></div>
          <div class="field"><label for="last-name-kana">フリガナ（姓）</label><input id="last-name-kana" name="lastNameKana" type="text"></div>
          <div class="field"><label for="first-name-kana">フリガナ（名）</label><input id="first-name-kana" name="firstNameKana" type="text"></div>
          <div class="field"><label for="company">会社名</label><input id="company" name="company" type="text"></div>
          <div class="field"><label for="company-size">会社規模</label><input id="company-size" name="companySize" type="text"></div>
          <div class="field"><label for="position">役職</label><input id="position" name="position" type="text"></div>
        </div>
        <div class="actions">
          <button class="register-button" type="submit">登録</button>
          <button class="delete-button" type="button" id="delete-selected">削除</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="registered-heading">
      <h2 id="registered-heading">登録済み顧客</h2>
      <p class="count" id="customer-count" aria-live="polite">登録件数：0件</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><span class="visually-hidden">選択</span></th>
              <th>No</th><th>姓</th><th>名</th><th>フリガナ（姓）</th><th>フリガナ（名）</th><th>会社名</th><th>会社規模</th><th>役職</th>
            </tr>
          </thead>
          <tbody id="customer-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('customer-form');
    const customerList = document.getElementById('customer-list');
    const customerCount = document.getElementById('customer-count');
    const customers = [];
    function renderCustomers() {
      customerList.replaceChildren();
      if (customers.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 9;
        cell.className = 'empty-message';
        cell.textContent = '登録済みの顧客はありません。';
        row.append(cell);
        customerList.append(row);
      } else {
        customers.forEach((customer, index) => {
          const row = document.createElement('tr');
          const checkCell = document.createElement('td');
          checkCell.className = 'checkbox-cell';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'customer-select';
          checkbox.value = String(index);
          checkbox.setAttribute('aria-label', `No ${customer.no} の顧客を選択`);
          checkCell.append(checkbox);
          row.append(checkCell);
          ['no', 'lastName', 'firstName', 'lastNameKana', 'firstNameKana', 'company', 'companySize', 'position'].forEach((key) => {
            const cell = document.createElement('td');
            cell.textContent = customer[key];
            row.append(cell);
          });
          customerList.append(row);
        });
      }
      customerCount.textContent = `登録件数：${customers.length}件`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const data = new FormData(form);
      const customer = {
        no: String(data.get('no')).trim(),
        lastName: String(data.get('lastName')).trim(),
        firstName: String(data.get('firstName')).trim(),
        lastNameKana: String(data.get('lastNameKana')).trim(),
        firstNameKana: String(data.get('firstNameKana')).trim(),
        company: String(data.get('company')).trim(),
        companySize: String(data.get('companySize')).trim(),
        position: String(data.get('position')).trim()
      };
      customers.push(customer);
      form.reset();
      renderCustomers();
    });

    document.getElementById('delete-selected').addEventListener('click', () => {
      const selected = new Set(
        [...customerList.querySelectorAll('.customer-select:checked')].map((checkbox) => Number(checkbox.value))
      );
      if (selected.size === 0) return;
      for (let index = customers.length - 1; index >= 0; index -= 1) {
        if (selected.has(index)) customers.splice(index, 1);
      }
      renderCustomers();
    });

    renderCustomers();
  </script>
</body>
</html>
